        <main>
          <section>
            <!-- this is the container for the activity form -->
            <div class="activityContainer">
                <h2>Emission Activity</h2>
                <form>
                    <div class="activityForm">
                        <label for="emissionName">Emission Name</label>
                        <input type="text" id="emissionName" placeholder="Name" required>               
                        <label for="emissionAmount">Emission Amount</label>
                        <input type="number" id="emissionAmount" placeholder="Amount" required>

                    <!-- emission category dropdown -->
                        <label for="emissionCategory">Emission Category</label>
                        <select id="emissionCategory" required>
                            <option value="">Select a category</option>
                            <option value="a6aafef5-5d49-4626-8cbb-20e9aed1f0a0">Transport</option>
                            <option value="57bdb22f-2561-4371-94fa-feeeb16ca05e">Home Energy</option>
                            <option value="263c2842-54bb-4c48-96cc-bc36c1e36131">Food</option>
                            <option value="f3f57226-0f42-479a-861c-f7da4bd5b176">Shopping</option>
                            <option value="4aeeb81c-97ee-4945-87f2-fed7bd13729e">Waste</option>
                            <option value="09004f40-3a19-417d-95c6-5b4f34da1af8">Other</option>
                        </select>
                    </div>
                    <button type="button" class="activityButton" onclick="addEmissionActivity(event)">Add emission amount</button>
                    <a href="Emission_Menu.html" class="activityButton activityRecordsButton">View emission records</a>
                    <p id="activityMessage" class="activityMessage">Added emission</p>

                </form>
            </div>     
    </section>
