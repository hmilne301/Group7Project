        <main>
            <section class="friends_layout">
                <!-- Where users friends are displayed -->
                <div id="friendsSection" class="friends_card">
                    <h2>Your Friends</h2>
                    <ul id="friendsList"></ul>
                    <p id="friendsMessage" role="status"></p>
                </div>

                <!-- Where users can add friends -->
                <div id="addFriendsSection" class="friends_card">
                    <h2>Add Friends</h2>
                    <form class ="add_friend_form" id ="addFriendForm" action="#">
                        <label for="username">Enter username</label>
                        <input type="text" id="username" name="username" placeholder="username">
                        <button type="submit" id="addFriendButton" class="add_friend_button">Add Friend</button>
                    </form>
                    <p id="addMessage" role="alert"></p>
                </div>

                <!-- Where Friend requests are displayed -->
                <div id="friendRequestsSection" class="friends_card">
                    <h2>Friend Requests</h2>
                    <ul id="requestList"></ul>
                    <p id="requestsMessage" role="status"></p>
                </div>
            </section>
