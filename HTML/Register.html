        <header>

        <main class="login_page">
            <section class="login_card" aria-labelledby="register_title">
                <h1 id="register_title">Create an account</h1>

                <form class="login_form register_form" id="registerForm" action="#" method="post">
                    <label for="username">Choose a username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Username"
                           autocomplete="username" required>

                    <label for="fname">Enter your first name</label>
                    <input type="text" id="fname" name="fname"
                           placeholder="John"
                           autocomplete="given-name" required>

                    <label for="lname">Enter your last name</label>
                    <input type="text" id="lname" name="lname"
                           placeholder="Smith"
                           autocomplete="family-name" required>

                    <label for="email">Enter your email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Email address"
                           autocomplete="email" required>

                    <label for="password">Create a password</label>
                    <div class="password_wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="Password"
                               autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle_password"
                        
                                aria-label="Show passwords" aria-pressed="false">Show</button>
                    </div>

                    <label for="confirm_password">Confirm your password</label>
                    <input type="password" id="confirmPassword" name="confirm_password"
                           placeholder="Re-enter password"
                           autocomplete="new-password" required>
                    <p class="match_message" aria-live="polite"></p>

                    <p id="registerMessage" class="register_message" role="alert"></p>
                    <div class="login_actions">
                        <p class="signup_prompt">
                            Already have an account?<br>
                            <a href="Login.html">Sign in</a>
                        </p>
                        <button type="submit" class="logButton login_submit">Sign up</button>
                    </div>
                </form>
            </section>
        </main>
