        <header>
            <div class="top_bar">
                <button class="nav_collapse" aria-label="Open menu" aria-expanded="false" aria-controls="main_nav">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <a href="Home.html" class="brand">COZERO</a>
            </div>
            <!--Navbar-->
            <nav class="navflex" id="main_nav">
                <ul>
                    <li><a href="Home.html"><i class="fa fa-fw fa-home" aria-hidden="true"></i>Home</a></li>
                    <li><a href="Dashboard.html"><i class="fa fa-fw fa-pie-chart" aria-hidden="true"></i>My Dashboard</a></li>

        <main class="login_page">
            <section class="login_card" aria-labelledby="reset_title">
                <h1 id="reset_title">Reset password</h1>

                <form class="login_form" id="resetForm" action="#" novalidate hidden>
                    <label for="password">New password</label>
                    <div class="password_wrapper">
                        <input type="password" id="password" name="password"
                            placeholder="At least 8 characters"
                            autocomplete="new-password" required>
                        <button type="button" class="toggle_password"
                                aria-label="Show passwords" aria-pressed="false">Show</button>
                    </div>

                    <label for="confirm_password">Confirm new password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="Type it again"
                           autocomplete="new-password" required>

                    <p id="resetMessage" class="login_message" role="alert"></p>

                    <div class="login_actions">
                        <button type="submit" class="logButton login_submit">Save password</button>
                    </div>
                </form>

                <!-- Shown while the link is checked, and if the link is invalid or expired -->
                <p id="linkMessage" class="login_message" role="status">Checking your reset link...</p>
            </section>
        </main>
