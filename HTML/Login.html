                <form class="login_form" action="#" method="post">
                    <label for="username">Enter your email address</label>
                    <input type="text" id="username" name="username"
                           placeholder="Email address"
                           autocomplete="username" required>

                    <label for="password">Enter your password</label>
<div class="password_wrapper">
    <input type="password" id="password" name="password"
           placeholder="Password"
           autocomplete="current-password" required>
    <button type="button" class="toggle_password"
            aria-label="Show password" aria-pressed="false">Show</button>
</div>

                    <a href="Forgot_Password.html" class="forgot_link">Forgot password?</a>

                        <p class="signup_prompt">

                        </p>
                        <button type="submit" class="logButton login_submit">Sign in</button>
